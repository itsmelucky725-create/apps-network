<!DOCTYPE html>
<html lang="$lang">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <title>$title · Zion Tech Group</title>
  $alternates
  <link rel="stylesheet" href="${prefix}assets/site.css">
  <script src="${prefix}assets/language.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">$skip_to_content</a>
  <div class="container">
    <header>
      <a class="brand" href="./">Zion Tech Group</a>
      <div id="language-control" hidden>
        <label for="lang">$language_label</label>
        <select id="lang">$options</select>
      </div>
      <nav id="language-links" aria-label="$language_label">
        <ul class="language-list">$language_links</ul>
      </nav>
    </header>
    <main id="main" tabindex="-1">
      <h1>$title</h1>
      <p class="lede">$description</p>
      $pending_notice
      <section aria-labelledby="apps-heading">
        <h2 id="apps-heading">$apps_heading</h2>
        <div class="app-list">$app_cards</div>
      </section>
    </main>
    <footer>Zion Tech Group · Apps Network</footer>
  </div>
</body>
</html>
